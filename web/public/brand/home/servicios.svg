<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Servicios background">
  <defs>
    <linearGradient id="svFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <pattern id="svDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0A0A0A" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#svFade)"/>
  <rect width="1600" height="900" fill="url(#svDots)"/>

  <!-- Ring light gigante (izquierda) -->
  <g transform="translate(320 450)" opacity="0.9">
    <circle r="220" fill="none" stroke="#00D64F" stroke-width="16" stroke-opacity="0.18"/>
    <circle r="200" fill="none" stroke="#00D64F" stroke-width="6"  stroke-opacity="0.35"/>
    <circle r="170" fill="#FFFFFF"/>
    <circle r="170" fill="none" stroke="#E5E5E5" stroke-width="2"/>
    <!-- Tripod -->
    <rect x="-6" y="200" width="12" height="200" fill="#0A0A0A" opacity="0.5"/>
    <line x1="0" y1="400" x2="-70" y2="470" stroke="#0A0A0A" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="400" x2="70"  y2="470" stroke="#0A0A0A" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="400" x2="0"   y2="470" stroke="#0A0A0A" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- Cámara DSLR (derecha) -->
  <g transform="translate(1150 430)" opacity="0.85">
    <rect x="-120" y="-70" width="240" height="150" rx="14" ry="14" fill="#0A0A0A"/>
    <rect x="-120" y="-110" width="110" height="50" rx="8" ry="8" fill="#0A0A0A"/>
    <circle cx="-10" cy="5" r="62" fill="#1A1A1A" stroke="#00D64F" stroke-width="4"/>
    <circle cx="-10" cy="5" r="42" fill="#0A0A0A" stroke="#00D64F" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-10" cy="5" r="20" fill="#00D64F" opacity="0.35"/>
    <!-- REC dot -->
    <circle cx="90" cy="-50" r="8" fill="#FF0033"/>
  </g>

  <!-- Focus/spotlight from ring light -->
  <g opacity="0.2">
    <polygon points="320,450 700,300 700,600" fill="#00D64F"/>
  </g>

  <!-- Micrófono icono decorativo (top right) -->
  <g transform="translate(1400 180)" opacity="0.35" stroke="#0A0A0A" stroke-width="4" fill="none">
    <rect x="-12" y="-36" width="24" height="52" rx="12"/>
    <path d="M-24 16 Q0 40 24 16"/>
    <line x1="0" y1="40" x2="0" y2="60"/>
    <line x1="-14" y1="60" x2="14" y2="60"/>
  </g>
</svg>
