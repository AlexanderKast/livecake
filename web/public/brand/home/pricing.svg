<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pricing background">
  <defs>
    <linearGradient id="prFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAFBEE"/>
    </linearGradient>
    <linearGradient id="prBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#00B043" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D64F" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#prFade)"/>

  <!-- Ascending bars (escalera de paquetes) -->
  <g transform="translate(320 720)">
    <rect x="0"   y="-140" width="180" height="140" rx="14" fill="url(#prBar)"/>
    <rect x="220" y="-260" width="180" height="260" rx="14" fill="url(#prBar)"/>
    <rect x="440" y="-420" width="180" height="420" rx="14" fill="url(#prBar)"/>
    <rect x="660" y="-560" width="180" height="560" rx="14" fill="url(#prBar)"/>
  </g>

  <!-- Arrow up diagonal -->
  <g opacity="0.18" stroke="#00B043" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M260 680 L1320 160"/>
    <path d="M1320 160 L1270 180"/>
    <path d="M1320 160 L1300 210"/>
  </g>

  <!-- Coin dots (valor acumulado) -->
  <g opacity="0.25" fill="#00D64F">
    <circle cx="1440" cy="120" r="16"/>
    <circle cx="1420" cy="180" r="12"/>
    <circle cx="1490" cy="220" r="10"/>
    <circle cx="1400" cy="260" r="8"/>
  </g>

  <!-- LIVE dot top-left -->
  <g transform="translate(140 140)">
    <circle r="20" fill="#FF0033" opacity="0.20"/>
    <circle r="9"  fill="#FF0033"/>
  </g>
</svg>
